aid: dascena
name: Dascena
description: 'Dascena was an Oakland, California health-technology company that built machine-learning
  diagnostic and clinical decision support algorithms for hospitals, most notably InSight, a sepsis
  prediction model that scored electronic health record vitals and labs in real time to flag patients
  at risk hours before onset, plus FDA breakthrough-designated models for acute kidney injury and
  gastrointestinal bleeding. The algorithms were delivered as an embedded integration inside a
  customer hospital''s EHR under a services and laboratory agreement rather than as a public developer
  API, so the company never operated a developer portal, published a machine-readable contract, or
  shipped client SDKs. CirrusDx acquired the Dascena Labs laboratory business effective 5 August 2022
  and the company identity now trades as DBA CirrusDx; the dascena.com domain no longer resolves.'
